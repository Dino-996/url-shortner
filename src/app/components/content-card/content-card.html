<section class="container my-3 p-3 border rounded-5 shadow bg-body">
    <!-- Title -->
    
    <div class="py-2 px-2 d-flex justify-content-between align-items-center">
    
        <h1>URL Shortener</h1>
        <app-overlay (originalUrl)="setOriginalUrl($event)"></app-overlay>
    
    </div>

    <!-- Area content -->
    <div class="col-auto">
        
        <div class="row m-2 p-2 border border-2 rounded-4 shadow text-dark w-auto d-inline-block">
            Link totali: {{ linkCounter() }}
        </div>

        <div class="row m-2 p-2 border border-2 rounded-4 shadow text-dark w-auto d-inline-block">
            Click totali: {{ clickCounter() }}
        </div>

    </div>
</section>
